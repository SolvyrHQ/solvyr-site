direct_answers:
  what_is_solvyr: A managed B2B service that turns bounded document and text backlogs into accepted AI-ready corpus output with run evidence.
  is_solvyr_a_gpu_provider: No. Customers buy completed corpus work; controlled distributed execution is supporting infrastructure.
  is_solvyr_an_orchestration_layer: No. Orchestration runs underneath the managed corpus service; customers buy the completed run rather than operating the scheduler or pipeline.
  what_fast_corpus_delivers: Extracted text, AI-ready JSONL, chunks, embeddings, stable IDs, caveats, and an inspectable run report.
  how_to_start: Submit a bounded backlog and output target, then use a representative non-sensitive sample for a capped pilot run.
