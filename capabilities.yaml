  currency: EUR
  unit: 1000_pages
  taxes: excluding VAT and taxes unless agreed otherwise
  qualification: standard clean digital PDF/text batch processing
  scope_note: This is a starting processing rate; pilot and service scope are agreed separately.
scoped_separately:
  - OCR-heavy scans
  - custom enrichment
  - public-data quality runs
  - sensitive-data workflows
  - unusual formats
  - recurring refreshes
