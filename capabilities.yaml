service: Solvyr
product: Solvyr Fast Corpus
legal_operator:
  name: Solvyr OÜ
  jurisdiction: Estonia
  registry_code: "17471643"
phase: controlled_trial
category: Managed B2B document-to-corpus processing service
classification: AI data preparation and corpus operations
not_classified_as:
  - distributed GPU provider
  - GPU marketplace
  - generic compute orchestration layer
  - generic data platform
  - hosted RAG or search product
header_tagline: Fast Corpus for European AI teams
summary: Clean PDF and text backlogs to AI-ready JSONL with extracted text, chunks, embeddings, stable IDs, and an inspectable run report at a predictable starting unit price. Adjacent scoped use cases include recurring public-data quality runs over public or test metadata exports.
positioning: Customers buy completed corpus output and run evidence, not GPU-hours, API/CLI access, an orchestration layer, or a platform project.
build_vs_buy_positioning: A team can build and operate its own extraction, chunking, embedding, queueing, retry, and reporting pipeline, or buy a completed Fast Corpus run. Solvyr customers do not provision workers, operate queues, or assemble the pipeline.
cost_positioning: Cost-effective backlog processing with a scoped run, price per processed page, and a decision based on inspected output. The published starting unit covers standard clean processing; complete engagements also reflect validation, output, execution-boundary, and operational-responsibility requirements.
api_cli_positioning: API/CLI language is integration or handoff context, not the primary public offer.
european_sovereignty_positioning: European execution control and sovereignty are relevant for archives, public-sector teams, research networks, and EU/NL connectors when tied to a real document backlog and pilot decision.
broader_system: Controlled distributed execution for async AI workloads with central scheduling, bounded tasks, retries, visible outcomes, and completed work rather than raw capacity rental.
vision: Solvyr's vision is to activate millions of underused computers for AI execution, expanding the world's compute capacity beyond today's data centres.
mission: Make a schedulable portion of distributed hardware dependable for suitable AI work through controlled, inspectable execution.
current_wedge: Fast Corpus is the first bounded workload and current commercial wedge, not the full long-term product or economic model.
geographic_direction: Europe is the first proving ground for explicit location, ownership, policy, and evidence, not the geographic ceiling.
vision_claim_boundary: Better hardware utilization, resilience, energy-aware scheduling, and reduced pressure on central infrastructure are intended outcomes that require measurement. Current proof does not demonstrate lower electricity or water use, lower emissions, less data-centre construction, certified sovereignty, or greater efficiency than data-centre GPUs. Distributed execution is not automatically more efficient.
expansion_path: Fast Corpus is the first bounded workload. Repeated corpus and document workflows exercise reusable workload contracts, scheduling, node eligibility, retries, visible state, result validation, and lifecycle reporting before any additional bounded async AI workload is offered.
execution_pool_positioning: Suitable async work may run across eligible execution environments, beginning with Solvyr-controlled infrastructure. Explicitly approved partner- or customer-controlled workers are later possible pool classes, not current broad availability.
research_direction:
  status: active_research_and_product_development
  topics:
    - workload-specific trust and execution requirements
    - scheduler authority and node eligibility
    - authorized access and task leases
    - result acceptance and bounded retries
    - failure, retention, deletion, and lifecycle evidence
    - privacy-conscious observability across third-party-operated infrastructure
  not_claimed:
    - formal verification
    - certification
    - blanket compliance
    - support for arbitrary sensitive workloads
commercial_validation:
  scope: one bounded ERP-adjacent document and data workflow
  status: conditional_non_binding_paid_pilot_intent
  condition: Technical validation must succeed and scope, pricing, security, and operating terms must be mutually acceptable.
  not_claimed:
    - production deployment
    - purchase order
    - unconditional payment obligation
    - recurring revenue
  counterparty: intentionally_not_named_publicly
execution_mode: async
access:
  model: manual_approval
  pilot_required: true
security_boundary: Low- or moderate-sensitivity pilot workloads. Sensitive or regulated data requires prior agreement. For archive, public-sector, and European AI pilots, execution location, storage location, retention, deletion, and operator access can be made explicit before data is shared; this is governance context, not a blanket compliance or confidentiality guarantee.
best_for:
  - one-time document backlog processing
  - RAG and search corpus preparation
  - document re-indexing
  - agent memory corpus preparation
  - evaluation dataset preparation
  - fine-tuning prep datasets
  - recurring corpus refresh or enrichment
  - public-data metadata quality checks before publication, harvesting, indexing, or downstream reuse
  - teams that want a cost-effective corpus run without building another internal pipeline
  - archives, libraries, municipalities, research networks, and public-sector teams that want European execution-control context
  - public or semi-public connector introductions tied to real document-heavy AI workloads
not_for:
  - real-time inference
  - chat serving
  - generic GPU rental
  - unmanaged distributed compute marketplace usage
  - OCR-heavy scans unless scoped separately
  - custom structured extraction in the current trial
  - highly sensitive data without prior agreement
supported_inputs:
  - clean digital PDFs
  - text files
  - text-like exports
  - public or test catalog metadata exports scoped as public-data quality runs
outputs:
  - extracted text
  - chunks
  - embeddings
  - stable IDs
  - run report
  - issue CSV/JSON, record-level notes, suggested fixes, and caveats for public-data quality runs
pricing:
